name: Playwright Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:
  schedule:
    - cron: '23 13 * * *'

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test
      env:
        ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
        ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    - uses: actions/upload-artifact@v7
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

    - name: Notify Slack
      if: ${{ success() || failure() }}
      continue-on-error: true
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        JOB_STATUS: ${{ job.status }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import urllib.error
        import urllib.request
        from pathlib import Path

        webhook = os.environ.get("SLACK_WEBHOOK_URL")
        if not webhook:
            print("::warning::Slack notification skipped because SLACK_WEBHOOK_URL is unavailable.")
            raise SystemExit(0)

        passed = os.environ["JOB_STATUS"] == "success"
        icon = "✅" if passed else "❌"
        label = "PASSED" if passed else "FAILED"
        title = f"{icon} Restful Booker UI Tests — {label}"

        triggers = {
            "push": "Push",
            "pull_request": "Pull Request",
            "schedule": "Scheduled",
            "workflow_dispatch": "Manual",
        }
        event = os.environ["GITHUB_EVENT_NAME"]
        trigger = triggers.get(event, event)
        run_url = (
            f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}"
            f"/actions/runs/{os.environ['GITHUB_RUN_ID']}"
        )

        fields = [{"type": "mrkdwn", "text": f"*Trigger*\n{trigger}"}]

        report = Path("test-results/playwright-summary.json")
        try:
            stats = json.loads(report.read_text(encoding="utf-8"))["stats"]
            tests = (
                f"{stats['expected']} passed · {stats['unexpected']} failed · "
                f"{stats['skipped']} skipped · {stats['flaky']} flaky"
            )
            minutes, seconds = divmod(round(stats["duration"] / 1000), 60)
            fields.extend([
                {"type": "mrkdwn", "text": f"*Tests (all browsers)*\n{tests}"},
                {"type": "mrkdwn", "text": f"*Duration*\n{minutes}m {seconds:02d}s"},
            ])
        except (OSError, ValueError, KeyError, TypeError):
            fields.append({
                "type": "mrkdwn",
                "text": "*Tests*\nTest summary unavailable — see Actions logs.",
            })

        payload = {
            "text": title,
            "blocks": [
                {"type": "header", "text": {"type": "plain_text", "text": title}},
                {
                    "type": "section",
                    "fields": fields,
                },
                {"type": "divider"},
                {
                    "type": "actions",
                    "elements": [{
                        "type": "button",
                        "text": {"type": "plain_text", "text": "View GitHub Actions Run"},
                        "url": run_url,
                        "action_id": "view_test_run",
                    }],
                },
            ],
        }

        request = urllib.request.Request(
            webhook,
            data=json.dumps(payload).encode("utf-8"),
            headers={"Content-Type": "application/json"},
            method="POST",
        )

        try:
            with urllib.request.urlopen(request, timeout=15) as response:
                print(f"Slack notification sent: HTTP {response.status}")
        except urllib.error.HTTPError as error:
            print(f"::warning::Slack notification failed: HTTP {error.code}.")
        except (urllib.error.URLError, TimeoutError):
            print("::warning::Slack notification could not reach the webhook.")
        PY